<div class="row">
    <mat-form-field appearance="outline" class="col">
        <mat-label>Name</mat-label>
        <input matInput
            type="text"
            placeholder="Name"
            [(ngModel)]="userForm.name"
        />
    </mat-form-field>

    <mat-form-field appearance="outline" class="col">
        <mat-label>Last name</mat-label>
        <input matInput
            type="text"
            placeholder="Last name"
            [(ngModel)]="userForm.lastName"
        />
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Email address</mat-label>
        <input matInput 
            type="email" 
            placeholder="Email address" 
            [(ngModel)]="userForm.emailAddress"
        />
    </mat-form-field>

    <mat-form-field appearance="outline" class="col">
        <mat-label>Password</mat-label>
        <input matInput
           type="password" 
           placeholder="Password" 
           [(ngModel)]="userForm.password" 
           (keyup)="onPasswordChange()"
        />
        @if (passwordTooShort) {
            <span class="err-email">Please enter min 8 characters.</span>
        }
    </mat-form-field>
    <mat-form-field appearance="outline" class="col">
        <input matInput
           type="password" 
           placeholder="Repeat password" 
           [(ngModel)]="repeatPassword"
        />
    </mat-form-field>
    
    <div>
        <button class="w-100 my-3" 
            matButton="outlined"
            (click)="onSignUpClick()" 
            [disabled]="isSignUpDisabled()"
        >   
            Sign Up
        </button>
    </div>
</div>

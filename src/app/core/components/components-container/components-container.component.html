<!-- List of navigations -->
<div #componentsContainer [class]="windowWidth > windowWidthLimit ? '' : 'small-screen-flex'" class="components-container">       
    @for (child of navigation.children; track child.id) {

        @if (windowWidth > windowWidthLimit) {
            <!-- Draggable element -->
            <div class="example-box"
                cdkDrag 
                [cdkDragDisabled]="!navigation.permissionName?.includes('edit')"
                (cdkDragEnded)="onDragEnded($event, child)"
                [cdkDragFreeDragPosition]="{
                    x: child.containerLayout.xPos ? (child.containerLayout.xPos * windowWidth / 100) : 0,
                    y: child.containerLayout.yPos ? (child.containerLayout.yPos * windowHeight / 100) : 0,
                }"
                [style.z-index]="child.containerLayout.zIndex"
            >
                <!-- Top left drag icon -->
                @if (navigation.permissionName?.includes('edit')) {
                    <i class="bi bi-arrows-move drag-icon" cdkDragHandle></i>
                }
                
                <!-- Navigation object -->
                <app-navigation
                    [_navigation]="child"
                    [_canAdd]="child.permissionName?.includes('add')"
                    [_canEdit]="child.permissionName?.includes('edit')"
                    [_canDelete]="child.permissionName?.includes('delete')"
                >
                </app-navigation>
            </div>
        }
        @else {
            <!-- Navigation object not draggable -->
            <app-navigation
                [_navigation]="child"
                [_canAdd]="child.permissionName?.includes('add')"
                [_canEdit]="child.permissionName?.includes('edit')"
                [_canDelete]="child.permissionName?.includes('delete')"
            >
            </app-navigation>
        }

    }
</div>
